<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardigan Aurora — Jaqueline Alves Atelier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <svg class="logo-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="24" cy="26" r="12"/><path d="M14 20c4 3 16 3 20 0M12 26h24M14 32c4-3 16-3 20 0"/><path d="M30 12l6-6M32 8l4 4"/></svg>
    <a href="index.html" class="logo">Jaqueline Alves Atelier</a>
    <div class="header-icons">
      <button aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button aria-label="Conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6"/></svg></button>
      <button aria-label="Carrinho" style="position:relative" data-open-cart><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span class="cart-count">0</span></button>
    </div>
  </div>
  <nav class="main-nav">
    <a href="index.html">Início</a>
    <a href="index.html#vestuario" class="active">Vestuário</a>
    <a href="index.html#acessorios">Acessórios</a>
    <a href="index.html#receitas">Receitas</a>
    <a href="index.html#decoracao">Decoração</a>
    <a href="index.html#contato">Contato</a>
    <a href="blog.html">Blog</a>
  </nav>
</header>

<div class="product-page wrap" id="product-detail">
  <p class="breadcrumb"><a href="index.html">Início</a> / <span id="breadcrumb-name">Produto</span></p>

  <div class="product-layout">
    <div>
      <div class="gallery-main" id="gallery-main"></div>
      <div class="gallery-thumbs" id="gallery-thumbs"></div>
    </div>

    <div class="product-info">
      <h1 id="p-name">Produto</h1>
      <p class="price-row" id="p-price">R$ 0,00</p>
      <p class="desc" id="p-desc"></p>

      <div class="option-group">
        <label class="name">Cor</label>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="option-group">
        <label class="name">Tamanho</label>
        <div class="size-options" id="size-options"></div>
      </div>

      <div class="qty-row">
        <div class="qty-control">
          <button class="qty-minus" aria-label="Diminuir">–</button>
          <span>1</span>
          <button class="qty-plus" aria-label="Aumentar">+</button>
        </div>
      </div>

      <div class="cta-row">
        <button class="btn btn-primary" data-add-cart style="flex:1">Adicionar à sacola</button>
      </div>

      <div class="encomenda-box" id="encomenda">
        <h3>Prefere sob encomenda?</h3>
        <p>Peça esta peça em cor, tamanho ou medida personalizada. A Jaque confirma prazo e valor com você.</p>
        <form id="encomenda-form">
          <div class="form-row">
            <div>
              <label for="nome">Seu nome</label>
              <input id="nome" type="text" required>
            </div>
            <div>
              <label for="whats">WhatsApp</label>
              <input id="whats" type="tel" placeholder="(00) 00000-0000" required>
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="medida">Tamanho / medida</label>
              <select id="medida">
                <option>P</option>
                <option selected>M</option>
                <option>G</option>
                <option>GG</option>
                <option>Medida personalizada</option>
              </select>
            </div>
            <div>
              <label for="cor">Cor desejada</label>
              <input id="cor" type="text" placeholder="Ex: verde sálvia">
            </div>
          </div>
          <div class="form-row full">
            <div>
              <label for="obs">Detalhes do pedido</label>
              <textarea id="obs" placeholder="Conte prazo desejado, ocasião, referências..."></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-outline">Enviar pedido de encomenda</button>
          <p class="form-msg" id="encomenda-msg"></p>
        </form>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p class="footer-bottom">© 2026 Jaqueline Alves Atelier — atelierdajaque.shop</p>
  </div>
</footer>

<script src="data/products.js"></script>
<script src="render.js"></script>
<script src="script.js"></script>
<script src="cart.js"></script>
</body>
</html>
